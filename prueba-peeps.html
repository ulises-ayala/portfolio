<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba · escena con Open Peeps</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body { padding: 48px 24px; }
  .demo { max-width: 640px; margin: 0 auto; }
  .demo h1 { font: 600 28px/1.2 var(--font-hero); letter-spacing: -.03em; margin-bottom: 8px; }
  .demo p.lead { color: var(--color-graphite); margin-bottom: 24px; }
  .panel {
    position: relative; overflow: hidden; height: 420px; border-radius: 24px;
    background: radial-gradient(circle at 1px 1px, rgba(12,23,84,.09) 1px, transparent 0) 0 0 / 18px 18px,
                linear-gradient(160deg, #eef0fb 0%, #f6f4f0 100%);
    border: 1px solid #e7e8f6;
  }
  .stage { position: absolute; left: 0; right: 0; bottom: -70px; display: flex; justify-content: center; gap: 0; }
  .actor { position: relative; width: 44%; animation: breathe 4s ease-in-out infinite; }
  .actor--b { animation-delay: -2s; }
  .actor--b .peep { transform: scaleX(-1); } /* mira hacia el otro */
  .peep { display: block; width: 100%; height: auto; overflow: visible; }
  .peep__head { transform-box: view-box; transform-origin: 120px 160px; }

  /* Turnos de 4 s: habla A, después B (mismo ciclo desfasado) */
  .actor .peep__head { animation: nod 8s ease-in-out infinite; }
  .actor .bubble { animation: bubble-turn 8s ease infinite; }
  .actor--a .peep__head, .actor--a .bubble { animation-delay: -4s; } /* primero pregunta la clienta (B) */
  @keyframes nod {
    0%, 47%, 100% { transform: rotate(0) translateY(0); }
    6%  { transform: rotate(-4deg) translateY(-3px); }
    12% { transform: rotate(2deg)  translateY(1px); }
    18% { transform: rotate(-3deg) translateY(-2px); }
    24% { transform: rotate(2deg)  translateY(1px); }
    30% { transform: rotate(-4deg) translateY(-3px); }
    38% { transform: rotate(1deg)  translateY(0); }
  }
  @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .bubble { bottom: calc(100% - 4px); width: 210px; }
  .actor--a .bubble { left: 40%; transform-origin: left bottom; }
  .actor--a .bubble::after { left: 28px; transform: rotate(45deg); }
  .actor--b .bubble { right: 40%; transform-origin: right bottom; }
  .actor--b .bubble::after { right: 28px; transform: rotate(45deg); }
</style>
</head>

    <h1>Prueba: escena con Open Peeps</h1>
    <p class="lead">Misma conversación que la escena con tus caricaturas. La cabeza asiente mientras habla cada uno; la piel y el pelo llevan el relleno de puntitos.</p>
